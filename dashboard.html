function stripDarkFaces(mesh, keepBelowY){

  if (sum > 0.5) return 0;

  const keep = []; let removed = 0;

    const a = idxArr[t], b = idxArr[t+1], c = idxArr[t+2];
    const ax = pos.getX(a), ay = pos.getY(a), az = pos.getZ(a);
    const bx = pos.getX(b), by = pos.getY(b), bz = pos.getZ(b);
    const cx = pos.getX(c), cy = pos.getY(c), cz = pos.getZ(c);
    const ux = bx-ax, uy = by-ay, uz = bz-az;
    const vx = cx-ax, vy = cy-ay, vz = cz-az;

    if (area > 6 && maxY > keepBelowY){ removed++; continue; }
    keep.push(a, b, c);
  }
  if (removed && keep.length){ g.setIndex(keep); g.computeVertexNormals(); }
  return removed;
}

function stripLongTriangles(o, MAXEDGE = 25){
  const g = o.geometry; if (!g || !g.index) return;
  const pos = g.attributes.position, idxA = g.index, n = idxA.count / 3;
  const keep = [];
  for (let t = 0; t < n; t++){
    const a = idxA.getX(t*3), b1 = idxA.getX(t*3+1), c1 = idxA.getX(t*3+2);
    const ax = pos.getX(a), ay = pos.getY(a), az = pos.getZ(a);
    const bx = pos.getX(b1), by = pos.getY(b1), bz = pos.getZ(b1);
    const cx = pos.getX(c1), cy = pos.getY(c1), cz = pos.getZ(c1);
    const d = Math.max(Math.hypot(ax-bx, ay-by, az-bz), Math.hypot(bx-cx, by-cy, bz-cz), Math.hypot(cx-ax, cy-ay, cz-az));
    if (d <= MAXEDGE) keep.push(a, b1, c1);
  }
  if (keep.length < idxA.count){ g.setIndex(keep); g.computeBoundingSphere(); }
}

function stripLongEdges(mesh, maxLen){
  const g = mesh.geometry, pos = g && g.attributes && g.attributes.position;
  if (!pos) return 0;
  let idxArr;
  if (g.index) idxArr = g.index.array;
  else { const n = pos.count; idxArr = new Uint32Array(n); for (let i = 0; i < n; i++) idxArr[i] = i; }
  const keep = []; let removed = 0;
  const d2 = (a, b) => {
    const dx = pos.getX(a)-pos.getX(b), dy = pos.getY(a)-pos.getY(b), dz = pos.getZ(a)-pos.getZ(b);
    return dx*dx + dy*dy + dz*dz;
  };
  const lim = maxLen * maxLen;
  for (let t = 0; t < idxArr.length; t += 3){
    const a = idxArr[t], b = idxArr[t+1], c = idxArr[t+2];
    if (d2(a,b) > lim || d2(b,c) > lim || d2(c,a) > lim){ removed++; continue; }
    keep.push(a,b,c);
  }
  if (removed && keep.length){ g.setIndex(keep); g.computeVertexNormals(); }
  return removed;
}
function removeNeedles(mesh){
  const g = mesh.geometry; if (!g || !g.attributes || !g.attributes.position) return 0;
  const pos = g.attributes.position;
  let idxArr;
  if (g.index) idxArr = g.index.array;
  else { const n = pos.count; idxArr = new Uint32Array(n); for (let i = 0; i < n; i++) idxArr[i] = i; }
  const triCount = idxArr.length / 3;
  const keep = [];
  let removed = 0;
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
  for (let t = 0; t < triCount; t++){
    const ia = idxArr[t*3], ib = idxArr[t*3+1], ic = idxArr[t*3+2];
    A.fromBufferAttribute(pos, ia); B.fromBufferAttribute(pos, ib); C.fromBufferAttribute(pos, ic);
    const e1 = A.distanceTo(B), e2 = B.distanceTo(C), e3 = C.distanceTo(A);

  }
  if (removed > 0 && keep.length){
    g.setIndex(keep);
    g.computeVertexNormals();
  }
  return removed;
}

  ];
  document.getElementById('kpi').innerHTML = items.map(([k,v]) => '<div class="k">' + k + ' <b>' + v + '</b></div>').join('');
  // 左侧：工区×工序热力表
  const procs = ['墙体砌筑','构造柱浇筑','内墙保温','内墙抹灰','外墙抹灰','外墙防水','外墙涂料','外架拆除','地坪','屋面防水','屋面瓦'];
  const zones = ['一工区','二工区','三工区'];
  const map = {};
  D.zone_process.forEach(z => { map[z.zone + '|' + z.process] = z.pct; });
  const color = p => p == null ? '#3a4655' : p >= 80 ? '#2f9e44' : p >= 40 ? '#f2c200' : p > 0 ? '#e8743b' : '#5a6473';
  let html = '<table><tr><th>工序</th>' + zones.map(z => '<th>' + z + '</th>').join('') + '</tr>';
  procs.forEach(p => {
    html += '<tr><td>' + p + '</td>' + zones.map(z => {
      const v = map[z + '|' + p];
      return '<td style="background:' + color(v) + ';color:#08121e;font-weight:600">' + (v == null ? '-' : v) + '</td>';
    }).join('') + '</tr>';
  });
  html += '</table><div style="margin-top:6px;color:#9fb3c8;font-size:10px">单位：%完成（完成层/总层）</div>';
  document.getElementById('boardLeft').innerHTML = html;

  // 点击楼栋
  const ray = new window.__THREE.Raycaster();
  const ndc = new window.__THREE.Vector2();
  const canvasEl = document.querySelector('canvas');
  (canvasEl || window).addEventListener('click', (ev) => {
    const el = ev.target;
    if (!el || el.tagName !== 'CANVAS') return;
    const rect = el.getBoundingClientRect();
    ndc.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    ndc.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    ray.setFromCamera(ndc, window.camera);
    const list = window.__buildings || [];
    let hit = null;
    for (const b of list){
      b.root.updateMatrixWorld(true);
      const r = ray.intersectObject(b.root, true);
      if (r.length && (!hit || r[0].distance < hit.d)) hit = { b, d: r[0].distance };
    }
    if (!hit){
      const p = document.getElementById('boardRight'); if (p) p.style.display = 'none';
      return;
    }
    showBuilding(hit.b.name);
  });

  function showBuilding(name){
    const b = D.buildings[name];
    if (!b) return;
    const panel = document.getElementById('boardRight');
    const line = (k, v) => '<div class="row"><span>' + k + '</span><b>' + v + '</b></div>';
    let h = '<h3>' + name + (b.type === '住宅' ? '#' : '') + '<span class="tag">' + b.zone + '</span></h3>';
    h += line('类型', b.type + ' / ' + b.floors + ' 层');
    ['内墙抹灰','外墙抹灰','屋面防水','屋面瓦','地坪'].forEach(p => {
      const d = b.proc[p];
      if (d) h += line(p, d.pct + '%（' + d.done + '/' + d.total + '）');
    });
    if (b.labor_reported) h += line('近4天报工', b.labor_reported + ' 工日');
    if (META && META.inferred_done) {
      const inf = META.inferred_done.filter(x => String(x.building) === String(name));
      if (inf.length) h += '<div class="row" style="color:#ffc46b"><span>其中推断完成（暂定）</span><b>' + inf.length + ' 层：' + inf.map(x => x.floor).join('、') + '</b></div>';
    }
    const iss = (D.issues || []).filter(i => String(i.building) === String(name));
    if (iss.length) {
      h += '<div class="row" style="margin-top:4px"><span>该栋问题</span><b>' + iss.length + ' 项（未闭 ' + iss.filter(i => /未|待/.test(i.status || '')).length + '）</b></div>';
      h += iss.slice(0, 5).map(i => '<div class="issue">⚠ [' + (i.id || '') + '][' + (i.level || i.severity || '-') + '] ' + (i.text || '') + ' <span style="color:#9fb3c8">(' + (i.status || '') + ')</span></div>').join('');
      if (iss.length > 5) h += '<div class="issue" style="color:#9fb3c8">… 其余 ' + (iss.length - 5) + ' 项</div>';
    }
    panel.innerHTML = h + '<div style="margin-top:8px;color:#9fb3c8;font-size:10px">点击模型空白处关闭</div>';
    panel.style.display = 'block';
  }
  let META = null;
  try { META = await fetch('./progress_meta.json?v=' + Date.now()).then(r => r.json()); } catch (e) {}
  // ===== 计划 vs 实际 & 预测完工 =====
  try {
    const PF = await fetch('./plan_forecast.json?v=' + Date.now()).then(r => r.json());
    const procs = ['内墙抹灰','外墙抹灰','屋面防水','屋面瓦','墙体砌筑','外墙防水','地坪','外架拆除'];
    const by = {}; (PF.process_plan || []).forEach(r => by[r.process] = r);
    const color = g => g == null ? '#5a6473' : g <= -25 ? '#e0463b' : g <= -10 ? '#e8743b' : g < 0 ? '#f2c200' : '#2f9e44';
    let h = '<table><tr><th>工序</th><th>计划应完</th><th>实际</th><th>偏差</th><th>剩余层</th><th>峰值层/天</th><th>计划完工</th><th>预测(按峰值)</th></tr>';
    procs.forEach(p => {
      const r = by[p]; if (!r) return;
      h += '<tr><td>' + p + '</td>'
        + '<td>' + (r.plan_pct == null ? '-' : r.plan_pct + '%') + '</td>'
        + '<td>' + r.actual + '%</td>'
        + '<td style="color:' + color(r.gap) + ';font-weight:700">' + (r.gap == null ? '-' : (r.gap > 0 ? '+' : '') + r.gap) + '</td>'
        + '<td>' + (r.remain_floor ?? '-') + '</td>'
        + '<td>' + (r.speed_peak || '-') + '</td>'
        + '<td>' + (r.plan_end || '-') + '</td>'
        + '<td style="color:#ffd34d;font-weight:700">' + (r.forecast_peak || '无法预测') + '</td></tr>';
    });
    h += '</table><div style="margin-top:3px;color:#9fb3c8;font-size:10px">偏差=实际−计划(百分点)；峰值层/天=11-03~11-06 观测到的最高日完成层数；预测(按峰值)=剩余层÷峰值</div>';
    document.getElementById('boardPlan').innerHTML = h;
    // KPI 追加计划与预测
    const nei = by['内墙抹灰'] || {}, wai = by['外墙抹灰'] || {};
    const kpiEl = document.getElementById('kpi');
    if (kpiEl) kpiEl.innerHTML += '<div class="k">内粉计划 <b>' + (nei.plan_pct ?? '-') + '%</b></div>'
      + '<div class="k">内粉峰值 <b>' + (nei.speed_peak || '-') + ' 层/天</b></div>'
      + '<div class="k">内粉预测(峰值) <b>' + (nei.forecast_peak || '-') + '</b></div>';
  } catch (e) {}
  window.__showBuilding = showBuilding;
  window.__dashData = D;
}
</script>

<style>
#planToggle{display:none;position:fixed;right:10px;bottom:120px;z-index:30;background:#1f3b73;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:7px 12px;font-size:12px;font-family:system-ui}
@media (max-width: 900px){ #planToggle{display:block} }
</style>
<script>
(function(){
  var mq = matchMedia('(max-width: 900px)');
  function hideAll(){ var p=document.getElementById('boardPlan'), k=document.getElementById('kpi');
    if(p) p.style.display='none'; if(k) k.style.display='none'; }
  function showAll(){ var p=document.getElementById('boardPlan'), k=document.getElementById('kpi');
    if(p) p.style.display='block'; if(k) k.style.display='flex'; }
  if (mq.matches) setTimeout(hideAll, 3000);
  document.getElementById('planToggle').addEventListener('click', function(){
    var p=document.getElementById('boardPlan');
    var visible = p && p.style.display !== 'none';
    if (visible) hideAll(); else showAll();
  });
})();
</script>
