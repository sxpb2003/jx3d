function stripDarkFaces(mesh, keepBelowY){
  const mat = mesh.material; if (!mat || !mat.color) return 0;
  const sum = mat.color.r + mat.color.g + mat.color.b;
  if (sum > 0.5) return 0;
  const g = mesh.geometry; const pos = g.attributes.position;
  if (!pos) return 0;
  let idxArr;
  if (g.index) idxArr = g.index.array;
  else { const n = pos.count; idxArr = new Uint32Array(n); for (let i = 0; i < n; i++) idxArr[i] = i; }
  const keep = []; let removed = 0;
  for (let t = 0; t < idxArr.length; t += 3){
    const a = idxArr[t], b = idxArr[t+1], c = idxArr[t+2];
    const ax = pos.getX(a), ay = pos.getY(a), az = pos.getZ(a);
    const bx = pos.getX(b), by = pos.getY(b), bz = pos.getZ(b);
    const cx = pos.getX(c), cy = pos.getY(c), cz = pos.getZ(c);
    const ux = bx-ax, uy = by-ay, uz = bz-az;
    const vx = cx-ax, vy = cy-ay, vz = cz-az;
    const nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx;
    const area = 0.5*Math.sqrt(nx*nx+ny*ny+nz*nz);
    const maxY = Math.max(ay, by, cy);
    if (area > 6 && maxY > keepBelowY){ removed++; continue; }
    keep.push(a, b, c);
  }
  if (removed && keep.length){ g.setIndex(keep); g.computeVertexNormals(); }
  return removed;
}
function stripAboveRoof(mesh, minY){

  return removed;
}
function stripGroundSlabs(mesh, maxY){

}
function stripDegenerate(mesh){

function stripLongTriangles(o, MAXEDGE = 25){
  const g = o.geometry; if (!g || !g.index) return;
  const pos = g.attributes.position, idxA = g.index, n = idxA.count / 3;
  const keep = [];
  for (let t = 0; t < n; t++){
    const a = idxA.getX(t*3), b1 = idxA.getX(t*3+1), c1 = idxA.getX(t*3+2);
    const ax = pos.getX(a), ay = pos.getY(a), az = pos.getZ(a);
    const bx = pos.getX(b1), by = pos.getY(b1), bz = pos.getZ(b1);
    const cx = pos.getX(c1), cy = pos.getY(c1), cz = pos.getZ(c1);
    const d = Math.max(Math.hypot(ax-bx, ay-by, az-bz), Math.hypot(bx-cx, by-cy, bz-cz), Math.hypot(cx-ax, cy-ay, cz-az));
    if (d <= MAXEDGE) keep.push(a, b1, c1);
  }
  if (keep.length < idxA.count){ g.setIndex(keep); g.computeBoundingSphere(); }
}

function stripLongEdges(mesh, maxLen){
  const g = mesh.geometry, pos = g && g.attributes && g.attributes.position;
  if (!pos) return 0;
  let idxArr;
  if (g.index) idxArr = g.index.array;
  else { const n = pos.count; idxArr = new Uint32Array(n); for (let i = 0; i < n; i++) idxArr[i] = i; }
  const keep = []; let removed = 0;
  const d2 = (a, b) => {
    const dx = pos.getX(a)-pos.getX(b), dy = pos.getY(a)-pos.getY(b), dz = pos.getZ(a)-pos.getZ(b);
    return dx*dx + dy*dy + dz*dz;
  };
  const lim = maxLen * maxLen;
  for (let t = 0; t < idxArr.length; t += 3){
    const a = idxArr[t], b = idxArr[t+1], c = idxArr[t+2];
    if (d2(a,b) > lim || d2(b,c) > lim || d2(c,a) > lim){ removed++; continue; }
    keep.push(a,b,c);
  }
  if (removed && keep.length){ g.setIndex(keep); g.computeVertexNormals(); }
  return removed;
}
function removeNeedles(mesh){
  const g = mesh.geometry; if (!g || !g.attributes || !g.attributes.position) return 0;
  const pos = g.attributes.position;
  let idxArr;
  if (g.index) idxArr = g.index.array;
  else { const n = pos.count; idxArr = new Uint32Array(n); for (let i = 0; i < n; i++) idxArr[i] = i; }
  const triCount = idxArr.length / 3;
  const keep = [];
  let removed = 0;
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
  for (let t = 0; t < triCount; t++){
    const ia = idxArr[t*3], ib = idxArr[t*3+1], ic = idxArr[t*3+2];
    A.fromBufferAttribute(pos, ia); B.fromBufferAttribute(pos, ib); C.fromBufferAttribute(pos, ic);
    const e1 = A.distanceTo(B), e2 = B.distanceTo(C), e3 = C.distanceTo(A);
    const mx = Math.max(e1, e2, e3), mn = Math.min(e1, e2, e3);
    // 细长/退化三角形（压缩后常见的黑色尖刺）
    if ((mx > 3 && mn < 0.03) || (mx > 1 && mx / Math.max(mn, 1e-6) > 400)){ removed++; continue; }
    keep.push(ia, ib, ic);
  }
  if (removed > 0 && keep.length){
    g.setIndex(keep);
    g.computeVertexNormals();
  }
  return removed;
}

function makeLabel(text, color){
  const lines = String(text).split('\n');
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const fontOf = (sz) => 'bold ' + sz + 'px "Microsoft YaHei",sans-serif';

  let fs1 = 110;
  ctx.font = fontOf(fs1);
  let w1 = ctx.measureText(lines[0]).width;
  if (w1 > 222) fs1 = Math.max(46, Math.floor(fs1 * 222 / w1));
  // 次行：工区
  const fs2 = Math.round(fs1 * 0.56);

  ctx.strokeText(lines[0], 128, y1);
  ctx.fillStyle = color || '#ffd34d'; ctx.fillText(lines[0], 128, y1);
  if (lines.length > 1){

}

function maxFloorOf(b){
  const pd = progressData[b] || {nei:{}, wai:{}};
  let mx = 0;
  for (const k of Object.keys(pd.nei)) mx = Math.max(mx, parseInt(k,10)||0);
  for (const k of Object.keys(pd.wai)) mx = Math.max(mx, parseInt(k,10)||0);
  return mx || 1;
}
function floorOf(b, y){
  const bd = buildings.find(x => x.name === b);
  const lv = (floorsData[b] || []).slice().sort((a,c)=>a-c);
  const N = maxFloorOf(b);
  if (lv.length >= 2){
    const fe = lv.slice(0, N);                 // 前 N 项才是楼层标高，最后一项通常是屋面
    const roofY = lv.length > N ? lv[N] : null;
    if (roofY !== null && y >= roofY - 0.25) return N + 1;   // 屋面及以上：不归入任何楼层
    let f = 0;
    for (const e of fe) if (y >= e - 0.4) f++;
    return Math.min(N, Math.max(1, f));
  }
  if (!bd) return 1;
  const t = (y - bd.box.min.y) / Math.max(1e-6, (bd.box.max.y - bd.box.min.y));
  return Math.min(N, Math.max(1, Math.ceil(t * N)));
}
let roofData = window.roofData || {};
function roofTopOf(b){
  const lv = (floorsData[b] || []).slice().sort((a,c)=>a-c);
  if (!lv.length) return Infinity;
  const N = maxFloorOf(b);
  return lv.length > N ? lv[N] : lv[lv.length - 1];
}
function isRoof(b, y){
  const lv = (floorsData[b] || []).slice().sort((a,c)=>a-c);
  if (!lv.length) return false;
  const N = maxFloorOf(b);
  const top = lv.length > N ? lv[N] : lv[lv.length - 1];
  return y >= top - 1.2;
}

        const rd0 = roofData[b.name] || {};
        const key0 = m === 'rooffs' ? 'fangshui' : (m === 'roofbh' ? 'baohu' : 'guawa');
        const st0 = rd0[key0] || '—';
        if (m === 'roofgw') it.mesh.material = (st0 === '完成') ? M.roof_done : it.orig;
        else it.mesh.material = st0 === '完成' ? M.roof_done : (st0 === '施工中' ? M.roof_ing : it.orig);
        continue;
      }
      if (isGlass || it.isWin){ it.mesh.material = it.orig; continue; }
      const box = new THREE.Box3().setFromObject(it.mesh);
      const y = (box.min.y + box.max.y) / 2;
      if (it.isRoof){
        if (m.startsWith('roof')){
          const rd = roofData[b.name] || {};
          const key = m === 'rooffs' ? 'fangshui' : (m === 'roofbh' ? 'baohu' : 'guawa');
          const st = rd[key] || '—';
          if (m === 'roofgw'){

            it.mesh.material = (st === '完成') ? M.roof_done : it.orig;

function clampPan(){
  const P = window.PAN, t = controls.target;

  const cx = Math.min(P.maxX, Math.max(P.minX, t.x));

  const cz = Math.min(P.maxZ, Math.max(P.minZ, t.z));
