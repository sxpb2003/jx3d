<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>江峡三路 · 外脚手架（盘扣 + 绿网）</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#cfd7de;font-family:system-ui,"Microsoft YaHei",sans-serif}
#hud{position:fixed;left:10px;top:10px;color:#fff;font-size:12.5px;line-height:1.65;background:rgba(0,0,0,.5);padding:9px 13px;border-radius:9px;max-width:92vw}
#hud b{color:#ffd34d;font-size:15px}
#hud span{color:#9fd0ff}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
</head><body>
<div id="hud"><b>江峡三路 · 外脚手架（盘扣 + 绿色密目网）</b><br>
<span>跨距1.5m · 步距1.5m · 内排离墙0.2m · 排距0.9m · 逐层按楼板轮廓（L形也跟）</span><br>
单指拖动旋转 · 双指捏合缩放 · <a href="./index.html" style="color:#7fd1ff">进度模型 →</a></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './lib/OrbitControls.js';
import { GLTFLoader } from './lib/GLTFLoader.js';
import { DRACOLoader } from './lib/DRACOLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
window.scene = scene; window.THREE = THREE;
scene.background = new THREE.Color(0x9fb3c8);
scene.fog = new THREE.Fog(0x9fb3c8, 1600, 4200);
const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.3, 12000);
const controls = new OrbitControls(camera, renderer.domElement);
window.controls = controls; window.camera = camera;
controls.enableDamping = true;
controls.minPolarAngle = Math.PI/6; controls.maxPolarAngle = Math.PI/3;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a97a5, 2.6));
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dl1 = new THREE.DirectionalLight(0xffffff, 1.7); dl1.position.set(500, 800, 600); scene.add(dl1);
const dl2 = new THREE.DirectionalLight(0xffffff, 0.7); dl2.position.set(-500, 300, -600); scene.add(dl2);
const gridHelper = new THREE.GridHelper(1400, 70, 0x6a7d8c, 0x7c8e9c); gridHelper.position.y = 155; scene.add(gridHelper);

const loader = new GLTFLoader();
const draco = new DRACOLoader(); draco.setDecoderPath('./lib/draco/'); loader.setDRACOLoader(draco);

function meshTex(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0,0,128,128);
  x.fillStyle = '#000';
  for (let i=0;i<8;i++) for (let j=0;j<8;j++){ x.beginPath(); x.arc(i*16+8,j*16+8,5.0,0,Math.PI*2); x.fill(); }
  const t = new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,2); return t;
}
const netTex = meshTex();
const matSteel = new THREE.MeshStandardMaterial({ color: 0x9aa2a8, roughness: .55, metalness: .55 });
const matNet = new THREE.MeshStandardMaterial({ color: 0x2f8f3a, alphaMap: netTex, transparent: true, opacity: 0.62, alphaTest: 0.3, side: 2, roughness: .9, metalness: .05 });
const gPost = new THREE.CylinderGeometry(0.024, 0.024, 1, 6); gPost.translate(0, 0.5, 0);
const gBar  = new THREE.BoxGeometry(1, 0.048, 0.048);
const gNet  = new THREE.PlaneGeometry(1, 1);

const CELL = 0.6, STEPH = 1.5;
// 逐层轮廓：该层楼板栅格化 -> 外轮廓线段
function floorOutlines(glb){
  glb.scene.updateMatrixWorld(true);
  const slabs = [];
  glb.scene.traverse(o => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    if (!mats.some(m => m && m.name && m.name.indexOf('板') >= 0)) return;
    const b = new THREE.Box3().setFromObject(o);
    if (!b.isEmpty()) slabs.push({ y: (b.min.y+b.max.y)/2, box: b, mesh: o });
  });
  slabs.sort((a,c)=>a.y-c.y);
  const groups = [];
  for (const it of slabs){
    const g = groups.find(g => Math.abs(g.y-it.y) < 1.2);
    if (g) g.items.push(it); else groups.push({ y: it.y, items: [it] });
  }
  const v = new THREE.Vector3();
  const out = [];
  for (const g of groups){
    const bb = new THREE.Box3().makeEmpty();
    for (const it of g.items) bb.union(it.box);
    if (bb.isEmpty()) continue;
    const pad = 0.5;
    const minX = bb.min.x - pad, maxX = bb.max.x + pad, minZ = bb.min.z - pad, maxZ = bb.max.z + pad;
    const nx = Math.ceil((maxX-minX)/CELL), nz = Math.ceil((maxZ-minZ)/CELL);
    const grid = new Uint8Array(nx*nz);
    for (const it of g.items){
      const geo = it.mesh.geometry, pos = geo.attributes.position; if (!pos) continue;
      const idxArr = geo.index ? geo.index.array : null;
      const n = idxArr ? idxArr.length/3 : pos.count/3;
      const mw = it.mesh.matrixWorld;
      for (let t=0;t<n;t++){
        const ia = idxArr?idxArr[t*3]:t*3, ib = idxArr?idxArr[t*3+1]:t*3+1, ic = idxArr?idxArr[t*3+2]:t*3+2;
        const P = [ia,ib,ic].map(k => { v.fromBufferAttribute(pos,k).applyMatrix4(mw); return [v.x, v.z]; });
        const xs = P.map(p=>p[0]), zs = P.map(p=>p[1]);
        const x0 = Math.floor((Math.min.apply(null,xs)-minX)/CELL), x1 = Math.ceil((Math.max.apply(null,xs)-minX)/CELL);
        const z0 = Math.floor((Math.min.apply(null,zs)-minZ)/CELL), z1 = Math.ceil((Math.max.apply(null,zs)-minZ)/CELL);
        for (let ix=x0; ix<=x1; ix++) for (let iz=z0; iz<=z1; iz++){
          if (ix<0||iz<0||ix>=nx||iz>=nz) continue;
          const cx = minX + (ix+0.5)*CELL, cz = minZ + (iz+0.5)*CELL;
          const d1 = (P[1][0]-P[0][0])*(cz-P[0][1]) - (P[1][1]-P[0][1])*(cx-P[0][0]);
          const d2 = (P[2][0]-P[1][0])*(cz-P[1][1]) - (P[2][1]-P[1][1])*(cx-P[1][0]);
          const d3 = (P[0][0]-P[2][0])*(cz-P[2][1]) - (P[0][1]-P[2][1])*(cx-P[2][0]);
          const neg = (d1<0)||(d2<0)||(d3<0), posv = (d1>0)||(d2>0)||(d3>0);
          if (!(neg && posv)) grid[iz*nx+ix] = 1;
        }
      }
    }
    const segs = [];
    const occ = (ix,iz) => (ix>=0&&iz>=0&&ix<nx&&iz<nz) ? grid[iz*nx+ix] : 0;
    for (let ix=0; ix<nx; ix++) for (let iz=0; iz<nz; iz++){
      if (!occ(ix,iz)) continue;
      const x0 = minX + ix*CELL, z0 = minZ + iz*CELL, x1 = x0+CELL, z1 = z0+CELL;
      if (!occ(ix, iz-1)) segs.push([x0,z0,x1,z0]);
      if (!occ(ix, iz+1)) segs.push([x0,z1,x1,z1]);
      if (!occ(ix-1, iz)) segs.push([x0,z0,x0,z1]);
      if (!occ(ix+1, iz)) segs.push([x1,z0,x1,z1]);
    }
    if (segs.length) out.push({ y0: bb.min.y, y1: bb.max.y, segs: segs });
  }
  return out;
}

// 沿轮廓线段生成一段脚手架
function buildFromSegs(segs, y0, y1){
  const g = new THREE.Group();
  const M = new THREE.Matrix4();
  const bands = [];
  let z = y0;
  while (z < y1 - 0.05){ const z2 = Math.min(z + STEPH, y1); bands.push([z, z2]); z += STEPH; }
  if (!bands.length) bands.push([y0, y1]);
  const pieces = [];
  for (const sg of segs){
    const ax=sg[0], az=sg[1], bx=sg[2], bz=sg[3];
    const L = Math.hypot(bx-ax, bz-az);
    const n = Math.max(1, Math.round(L/1.5));
    for (let i=0;i<n;i++){
      const t0=i/n, t1=(i+1)/n;
      pieces.push([ax+(bx-ax)*t0, az+(bz-az)*t0, ax+(bx-ax)*t1, az+(bz-az)*t1]);
    }
  }
  const seen = new Set(); const pts = [];
  for (const pc of pieces){
    for (const [px,pz] of [[pc[0],pc[1]],[pc[2],pc[3]]]){
      const k = Math.round(px*10)+'_'+Math.round(pz*10);
      if (!seen.has(k)){ seen.add(k); pts.push([px,pz]); }
    }
  }
  const imPost = new THREE.InstancedMesh(gPost, matSteel, pts.length); let kp=0;
  for (const p of pts){ M.makeScale(1, y1-y0, 1); M.setPosition(p[0], y0, p[1]); imPost.setMatrixAt(kp++, M); }
  g.add(imPost);

  const bars = [], nets = [], braces = [];
  pieces.forEach((pc, pi) => {
    const ax=pc[0], az=pc[1], bx=pc[2], bz=pc[3];
    bands.forEach((band, bi) => {
      const z0=band[0], z1b=band[1];
      bars.push({ a:[ax,az,z0], b:[bx,bz,z0] });
      if (bi === bands.length-1) bars.push({ a:[ax,az,z1b], b:[bx,bz,z1b] });
      nets.push({ a:[ax,az], b:[bx,bz], z0:z0, z1:z1b });
      if (pi % 5 === 0){
        if (bi % 2 === 0) braces.push([{x:ax,y:z0,z:az},{x:bx,y:z1b,z:bz}]);
        else braces.push([{x:bx,y:z0,z:bz},{x:ax,y:z1b,z:az}]);
      }
    });
  });
  const imBar = new THREE.InstancedMesh(gBar, matSteel, Math.max(1,bars.length)); let kb=0;
  for (const b of bars){
    const v = new THREE.Vector3(b.b[0]-b.a[0], 0, b.b[2]-b.a[2]);
    const L = v.length(); if (L < 1e-4) continue;
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1,0,0), v.normalize());
    M.compose(new THREE.Vector3((b.a[0]+b.b[0])/2, b.a[1], (b.a[2]+b.b[2])/2), q, new THREE.Vector3(L,1,1));
    imBar.setMatrixAt(kb++, M);
  }
  imBar.count = kb; g.add(imBar);

  const imNet = new THREE.InstancedMesh(gNet, matNet, Math.max(1,nets.length)); let kn=0;
  for (const n of nets){
    const dx = n.b[0]-n.a[0], dz = n.b[1]-n.a[1];
    const L = Math.hypot(dx,dz); if (L < 1e-4) continue;
    const ang = Math.atan2(dz,dx);
    const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), -ang);
    M.compose(new THREE.Vector3((n.a[0]+n.b[0])/2, (n.z0+n.z1)/2, (n.a[1]+n.b[1])/2), q, new THREE.Vector3(L, n.z1-n.z0, 1));
    imNet.setMatrixAt(kn++, M);
  }
  imNet.count = kn; g.add(imNet);

  const imBrace = new THREE.InstancedMesh(gBar, matSteel, Math.max(1,braces.length)); let kb2=0;
  for (const bp of braces){
    const p0 = bp[0], p1 = bp[1];
    const v = new THREE.Vector3(p1.x-p0.x, p1.y-p0.y, p1.z-p0.z);
    const L = v.length(); if (L < 0.1) continue;
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1,0,0), v.clone().normalize());
    M.compose(new THREE.Vector3((p0.x+p1.x)/2,(p0.y+p1.y)/2,(p0.z+p1.z)/2), q, new THREE.Vector3(L,1,1));
    imBrace.setMatrixAt(kb2++, M);
  }
  imBrace.count = kb2; g.add(imBrace);
  return g;
}

const bj = await fetch('./buildings.json').then(r=>r.json());
const names = Object.keys(bj);
const cache = {};
async function glbFor(stem){ const k = stem.replace(/#/g,''); if(!cache[k]) cache[k] = await loader.loadAsync('./assets/'+k+'.glb'); return cache[k]; }

for (const name of names){
  const info = bj[name];
  const glb = await glbFor(info.stem);
  const clone = glb.scene.clone(true);
  clone.name = 'B_' + name;
  const mat = new THREE.Matrix4().fromArray(info.m);
  clone.applyMatrix4(mat); scene.add(clone);
  if (!info.__outlines){ info.__outlines = floorOutlines(glb); }
  info.__outlines.forEach((fo, idx) => {
    const sc = buildFromSegs(fo.segs, fo.y0, fo.y1 - 0.25);
    sc.name = 'SCAF_' + name + '_' + idx;
    sc.applyMatrix4(mat);
    scene.add(sc);
  });
}

const all = new THREE.Box3();
scene.children.forEach(o => { if (o.isGroup || o.isMesh){ try { all.expandByObject(o); } catch(e){} } });
const ctr = all.getCenter(new THREE.Vector3());
const size = all.getSize(new THREE.Vector3());
const R = 0.5*Math.sqrt(size.x*size.x + size.z*size.z);
const vf = camera.fov*Math.PI/180;
const hf = 2*Math.atan(Math.tan(vf/2)*camera.aspect);
const dist = Math.max(420, R/Math.sin(Math.min(vf,hf)/2)*1.02);
controls.target.copy(ctr);
camera.position.set(ctr.x - dist*0.55, ctr.y + dist*0.8, ctr.z + dist*0.9);
controls.autoRotate = true; controls.autoRotateSpeed = 0.3;
controls.update();
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body></html>
